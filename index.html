<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohamed Hazem</title>

<style>
* {
  box-sizing: border-box;
}

html {
  background: #05070a;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Tahoma, sans-serif;
  color: #fff;

  background:
    radial-gradient(circle at 80% 15%, rgba(180,150,80,.10), transparent 25%),
    radial-gradient(circle at 15% 75%, rgba(40,60,90,.12), transparent 30%),
    linear-gradient(145deg, #05070a 0%, #0c1117 45%, #05070a 100%);

  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
  position: relative;
  overflow-x: hidden;
}

/* خطوط ديكورية في الخلفية */
body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 180px;
  top: -70px;
  left: -170px;
  background: linear-gradient(
    135deg,
    transparent 35%,
    rgba(255,255,255,.035) 36%,
    rgba(255,255,255,.035) 55%,
    transparent 56%
  );
  transform: rotate(-15deg);
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  width: 420px;
  height: 420px;
  bottom: -250px;
  right: -180px;
  border-radius: 50%;
  background: rgba(190,150,65,.07);
  filter: blur(90px);
  pointer-events: none;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 34px 20px 28px;
  text-align: center;
  position: relative;
  z-index: 2;
}

/* الصورة */
.profile {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;

  border: 3px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 0 5px rgba(255,255,255,.035),
    0 15px 45px rgba(0,0,0,.7);

  margin-bottom: 14px;
}

/* الاسم */
h1 {
  margin: 5px 0 10px;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: .3px;
}

/* الخط الذهبي تحت الاسم */
.name-line {
  width: 55px;
  height: 2px;
  margin: 0 auto 10px;
  background: #c9a65b;
  border-radius: 10px;
}

/* الوصف */
.subtitle {
  color: #9da4ad;
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 28px;
}

/* كل الأزرار */
.button {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 78px;

  text-decoration: none;
  color: #fff;

  padding: 13px 18px;
  margin: 13px 0;

  border-radius: 20px;

  background: rgba(18,24,32,.86);
  border: 1px solid rgba(125,140,160,.22);

  box-shadow:
    0 10px 30px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.025);

  transition: all .25s ease;
  overflow: hidden;
}

.button:hover {
  transform: translateY(-3px);
  border-color: rgba(201,166,91,.45);
  box-shadow:
    0 15px 35px rgba(0,0,0,.4),
    0 0 20px rgba(201,166,91,.06);
}

.button:active {
  transform: scale(.98);
}

/* أيقونة */
.icon {
  width: 49px;
  height: 49px;
  min-width: 49px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  font-size: 25px;
  margin-left: 15px;

  background: rgba(255,255,255,.07);
}

/* النص */
.button-text {
  text-align: right;
  flex: 1;
}

.button-title {
  display: block;
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 5px;
}

.button-subtitle {
  display: block;
  font-size: 13px;
  color: #8f98a4;
  font-weight: normal;
}

/* السهم */
.arrow {
  font-size: 25px;
  color: #aeb5bd;
  direction: ltr;
  margin-right: 8px;
}

/* InstaPay */
.instapay {
  min-height: 92px;

  background:
    linear-gradient(
      100deg,
      #3020d5 0%,
      #5a20c8 38%,
      #b83c86 68%,
      #ff7147 100%
    );

  border: none;

  box-shadow:
    0 15px 40px rgba(73,35,190,.30);
}

.instapay:hover {
  border: none;
  box-shadow:
    0 18px 45px rgba(103,40,210,.42);
}

.instapay .icon {
  background: rgba(255,255,255,.15);
  font-size: 24px;
}

.instapay .button-subtitle {
  color: rgba(255,255,255,.85);
}

.instapay .arrow {
  color: #fff;
}

/* ألوان الأيقونات */
.whatsapp .icon {
  background: rgba(37,211,102,.15);
}

.facebook .icon {
  background: rgba(24,119,242,.15);
}

.instagram .icon {
  background: rgba(225,48,108,.15);
}

.phone-button .icon {
  background: rgba(201,166,91,.12);
}

/* رقم التليفون */
.phone {
  margin-top: 25px;
  color: #8e969f;
  direction: ltr;
  font-size: 14px;
  letter-spacing: 1px;
}

/* الفوتر */
.footer {
  margin-top: 30px;
  color: #626a74;
  font-size: 11px;
  letter-spacing: 2px;
}

.footer-line {
  width: 90px;
  height: 1px;
  background: rgba(255,255,255,.18);
  margin: 0 auto 12px;
}

/
